name: sync data

on:
  workflow_dispatch: {}
  schedule:
    # 06:32 UTC = 15:32 KST, 한국 장마감(15:30) 직후 — 오후 보고서(15:35 KST)용
    - cron: '32 6 * * *'
    # 21:30 UTC = 06:30 KST(다음날), 미국장 마감 이후 — 아침 보고서(07:00 KST)용
    - cron: '30 21 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance
      - run: python3 scripts/sync_data.py
      - name: commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto: data sync $(date -u +%Y-%m-%d)"
          git push
      # Notion 갱신(scripts/notion_writer.py)은 2026-10-02에 뺐다. "부자 되는 중"
      # 루틴을 끄면서 같이 멈췄다. latest.json은 portfolio-dashboard의 ISA 화면이
      # 읽으므로 수집은 그대로 둔다.
