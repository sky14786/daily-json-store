name: sync data

on:
  workflow_dispatch: {}
  schedule:
    # 06:32 UTC = 15:32 KST, 한국 장마감(15:30) 직후 — 오후 보고서(15:35 KST)용
    - cron: '32 6 * * *'
    # 21:30 UTC = 06:30 KST(다음날), 미국장 마감 이후 — 아침 보고서(07:00 KST)용
    - cron: '30 21 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet yfinance
      - run: python3 scripts/sync_data.py
      - name: commit + push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "auto: data sync $(date -u +%Y-%m-%d)"
          git push
      # 아침(06:30 KST) sync는 한국장이 아직 안 열려 어제 마감가 그대로라 메인
      # 페이지를 여기서 갱신하면 "오늘 날짜인데 어제 숫자"로 보여 오해를 줄 수 있음
      # — 그래서 오후(15:32 KST) sync 때만 Notion에 씀. workflow_dispatch(수동
      # 테스트)일 때도 실행되게 해둠.
      - name: Notion 메인/상세 페이지 갱신 (오후 sync에만)
        if: github.event.schedule == '32 6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 scripts/notion_writer.py
